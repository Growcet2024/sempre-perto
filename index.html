<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Exames</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#F2F8F4; --card:#FFFFFF; --btn:#3CA370; --btn-dark:#2E7D5B;
  --text:#1F2D27; --text2:#6B7D74; --border:#D9E6DD; --danger:#C0392B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201A; --card:#1B2B23; --btn:#3CA370; --btn-dark:#2E7D5B;
    --text:#EAF3EE; --text2:#9BB3A7; --border:#2C4034; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201A; --card:#1B2B23; --btn:#3CA370; --btn-dark:#2E7D5B;
  --text:#EAF3EE; --text2:#9BB3A7; --border:#2C4034; color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:480px;margin:0 auto;padding:16px;min-height:100%;}
.title-row{display:flex;align-items:center;gap:8px;margin:0 0 10px;}
.app-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;}
.app-icon img{width:100%;height:100%;object-fit:contain;border-radius:6px;}
h1.app-title{font-size:19px;font-weight:600;margin:0;}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--btn);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:16px;font-weight:600;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.who{flex:1;min-width:0;}
.who .name{font-weight:500;font-size:16px;}
.who .idline{font-size:12px;color:var(--text2);margin-top:2px;}
.menu-btn{background:none;border:none;font-size:24px;color:var(--text);cursor:pointer;padding:6px;line-height:1;}
.offline-note{font-size:13px;color:var(--text2);margin:2px 0 18px;}
.btn{display:block;width:100%;background:var(--btn);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:16px;font-weight:500;margin-bottom:12px;cursor:pointer;text-align:center;}
.btn:active{background:var(--btn-dark);}
.btn.secondary{background:none;color:var(--btn-dark);border:1px solid var(--border);}
.back{background:none;border:none;color:var(--text2);font-size:15px;cursor:pointer;padding:8px 0;margin-bottom:8px;
  display:flex;align-items:center;gap:4px;}
.back svg{width:20px;height:20px;flex-shrink:0;}
.search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);
  color:var(--text);font-size:15px;margin-bottom:18px;}
.list-label{font-size:13px;color:var(--text2);margin:0 0 10px;}
.flat-list{border-top:1px solid var(--border);}
.flat-item{padding:8px 2px;border-bottom:1px solid var(--border);cursor:pointer;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.flat-item-stack{padding:9px 2px;border-bottom:1px solid var(--border);cursor:pointer;}
.flat-item-stack .name{font-weight:500;font-size:15px;}
.flat-item-stack .ref{font-size:13px;color:var(--text2);margin-top:2px;}
.cols{display:grid;grid-template-columns:1.5fr 1fr .8fr .8fr;gap:6px;align-items:center;margin-top:3px;font-size:13px;color:var(--text2);}
.cols span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cols .res{color:var(--text);}
.flat-item{flex-direction:row;align-items:flex-start;}
.flat-item .left{min-width:0;}
.flat-item .name{font-weight:500;font-size:15px;}
.flat-item .ref{font-size:12px;color:var(--text2);margin-top:2px;}
.flat-item .right{text-align:right;flex-shrink:0;}
.flat-item .value{font-size:15px;}
.flat-item .date{font-size:12px;color:var(--text2);margin-top:2px;}
.empty{color:var(--text2);text-align:center;padding:40px 16px;font-size:14px;}
label{display:block;font-size:13px;color:var(--text2);margin:14px 0 6px;}
input[type=text],input[type=date],input[type=number]{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);
  color:var(--text);font-size:16px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.result-row{padding:12px 2px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;}
.result-row .date{font-size:13px;color:var(--text2);}
.result-row .value{font-weight:500;font-size:16px;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:4px;vertical-align:middle;}
.tag-alto{background:#FBEAE8;color:#B23A2E;}
.tag-baixo{background:#FFF1DE;color:#A05A00;}
.tag-normal{background:#E6F4EC;color:#2E7D5B;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag-alto{background:#3A2320;color:#F2A69C;}
  :root:not([data-theme="light"]) .tag-baixo{background:#3A2A14;color:#F2C089;}
  :root:not([data-theme="light"]) .tag-normal{background:#1E3327;color:#8FD1AC;}}
:root[data-theme="dark"] .tag-alto{background:#3A2320;color:#F2A69C;}
:root[data-theme="dark"] .tag-baixo{background:#3A2A14;color:#F2C089;}
:root[data-theme="dark"] .tag-normal{background:#1E3327;color:#8FD1AC;}
.edit-link{font-size:13px;color:var(--btn-dark);background:none;border:none;cursor:pointer;padding:4px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;font-size:14px;color:var(--text2);}
.tab.active{background:var(--btn);color:#fff;border-color:var(--btn);}
.hide{display:none;}
.err{color:var(--danger);font-size:13px;margin-top:4px;}
.muted{color:var(--text2);font-size:13px;line-height:1.6;}
.section-title{font-size:15px;font-weight:500;margin:0 0 10px;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:10px;padding:10px 14px;
  font-size:14px;color:var(--text);cursor:pointer;}
.photo-tag{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:7px 16px;font-size:13px;color:var(--btn-dark);cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;}
.menu-panel{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--bg);
  z-index:21;padding:20px 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));
  box-shadow:-4px 0 20px rgba(0,0,0,.15);}
.menu-item{padding:14px 4px;font-size:16px;border-bottom:1px solid var(--border);cursor:pointer;}
.menu-item:active{color:var(--btn-dark);}
.menu-close{background:none;border:none;font-size:22px;color:var(--text2);cursor:pointer;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('MeusExamesDB', 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('profile')) d.createObjectStore('profile',{keyPath:'id'});
      if(!d.objectStoreNames.contains('exams')) d.createObjectStore('exams',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('results')) d.createObjectStore('results',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = e=>{db=e.target.result; res(db);};
    req.onerror = e=>rej(e);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function getAll(store){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function getOne(store,key){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').get(key); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function put(store,val){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(val); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
function clearStore(store){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=rej; }); }

let profile = null;
let downloadsCap = null;
if(typeof claude !== 'undefined' && claude.use){
  claude.use('downloads').then(d=>downloadsCap=d).catch(()=>{});
}

function genId(){
  const now=new Date();
  const p=n=>String(n).padStart(2,'0');
  const stamp = String(now.getFullYear()).slice(2)+p(now.getMonth()+1)+p(now.getDate());
  const rand = Math.random().toString(36).slice(2,6);
  return stamp+rand;
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  return d+'/'+m+'/'+y.slice(2);
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1]? parts[1][0] : '')).toUpperCase();
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function firstNumber(s){
  const m = (s||'').replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function parseReference(ref){
  if(!ref) return null;
  const r = ref.toLowerCase();
  const nums = (r.match(/-?\d+(\.\d+)?/g)||[]).map(n=>parseFloat(n));
  if(/\bate\b|\bat\u00e9\b|menor que|menor de|abaixo de/.test(r) && nums.length>=1) return {max: nums[0]};
  if(/acima de|maior que|maior de|a partir de/.test(r) && nums.length>=1) return {min: nums[0]};
  if(nums.length>=2) return {min: Math.min(nums[0],nums[1]), max: Math.max(nums[0],nums[1])};
  return null;
}
function refLabel(ex){
  if(ex.min && ex.max) return ex.min+' a '+ex.max;
  if(ex.max) return 'até '+ex.max;
  if(ex.min) return 'acima de '+ex.min;
  return '-';
}
function compareResult(value, ex){
  const v = firstNumber(value);
  if(v===null) return null;
  const minN = ex.min ? firstNumber(ex.min) : null;
  const maxN = ex.max ? firstNumber(ex.max) : null;
  if(minN===null && maxN===null) return null;
  if(maxN!==null && v>maxN) return 'alto';
  if(minN!==null && v<minN) return 'baixo';
  return 'normal';
}

/* Cole aqui o código base64 do ícone do app (ex: 'data:image/png;base64,iVBORw0...').
   Enquanto estiver vazio, aparece um símbolo provisório no lugar. */
const APP_ICON_BASE64 = '';
function appIconHtml(){
  return APP_ICON_BASE64
    ? `<div class="app-icon"><img src="${APP_ICON_BASE64}"></div>`
    : `<div class="app-icon">🩺</div>`;
}

const appIconImg = new Image();
if(APP_ICON_BASE64) appIconImg.src = APP_ICON_BASE64;

const app = document.getElementById('app');
function render(html){ app.innerHTML = html; }

async function boot(){
  await openDB();
  profile = await getOne('profile','main');
  if(!profile){ profile = {id:'main', name:'', userId:'', avatar:null}; }
  if(profile.userId && !/^\d{6}[a-z0-9]{4}$/.test(profile.userId)){
    profile.userId = genId();
    await put('profile', profile);
  }
  const exams = await getAll('exams');
  for(const ex of exams){
    if(ex.min===undefined && ex.max===undefined){
      const range = parseReference(ex.reference);
      ex.min = range && range.min!==undefined ? String(range.min) : '';
      ex.max = range && range.max!==undefined ? String(range.max) : '';
      await put('exams', ex);
    }
  }
  showHome();
}

function headerHtml(){
  const av = profile.avatar ? `<img src="${profile.avatar}">` : initials(profile.name);
  return `
    <div class="title-row">${appIconHtml()}<h1 class="app-title">Meus Exames</h1></div>
    <header class="top">
      <div class="avatar">${av}</div>
      <div class="who"><div class="name">${profile.name? escapeHtml(profile.name) : 'Sem nome cadastrado'}</div>${profile.userId? `<div class="idline">ID: ${escapeHtml(profile.userId)}</div>` : ''}</div>
      <button class="menu-btn" onclick="openMenu()" aria-label="Menu">&#9776;</button>
    </header>
    <p class="offline-note">App funciona sem internet</p>
  `;
}
function openMenu(){
  const overlay = document.createElement('div');
  overlay.className='overlay'; overlay.id='menuOverlay'; overlay.onclick=closeMenu;
  const panel = document.createElement('div');
  panel.className='menu-panel'; panel.onclick=e=>e.stopPropagation();
  panel.innerHTML = `
    <button class="menu-close" onclick="closeMenu()">&times;</button>
    <div class="menu-item" onclick="closeMenu();showPerfil();">Perfil</div>
    <div class="menu-item" onclick="closeMenu();showCadastro();">Cadastro</div>
    <div class="menu-item" onclick="closeMenu();showHistorico();">Histórico</div>
    <div class="menu-item" onclick="closeMenu();showComoUsar();">Como usar</div>
    <div class="menu-item" onclick="closeMenu();showBackup();">Backup</div>
  `;
  document.body.appendChild(overlay);
  document.body.appendChild(panel);
}
function closeMenu(){
  document.getElementById('menuOverlay')?.remove();
  document.querySelector('.menu-panel')?.remove();
}

async function showHome(filter){
  const noName = !profile.name;
  const exams = await getAll('exams');
  const results = await getAll('results');
  let rows = exams.map(ex=>{
    const rs = results.filter(r=>r.examId===ex.id).sort((a,b)=>b.date.localeCompare(a.date));
    return {ex, last: rs[0]};
  }).filter(r=>r.last);
  rows.sort((a,b)=>a.ex.name.localeCompare(b.ex.name));
  const f = (filter||'').toLowerCase();
  const filtered = f ? rows.filter(r=>r.ex.name.toLowerCase().includes(f)) : rows;

  const itemsHtml = filtered.length ? `<div class="flat-list">` + filtered.map(r=>{
    const comp = compareResult(r.last.value, r.ex) || 'normal';
    const tag = `<span class="tag tag-${comp}">${comp==='alto'?'Alto':comp==='baixo'?'Baixo':'Normal'}</span>`;
    return `
    <div class="flat-item-stack" onclick="showExam(${r.ex.id})">
      <div class="name">${escapeHtml(r.ex.name)}</div>
      <div class="cols"><span>${escapeHtml(refLabel(r.ex))}</span><span>${fmtDate(r.last.date)}</span><span class="res">${escapeHtml(r.last.value)}</span><span>${tag}</span></div>
    </div>`;
  }).join('') + `</div>` : `<div class="empty">${rows.length? 'Nenhum exame encontrado.' : 'Nenhum resultado lançado ainda. Use o menu para cadastrar um exame.'}</div>`;

  const notice = noName ? `<p class="muted" style="margin:-10px 0 16px;">Cadastre seu nome em <strong style="font-weight:500;color:var(--text)">Perfil</strong> (menu &#9776;) para personalizar o app.</p>` : '';
  render(`
    ${headerHtml()}
    ${notice}
    <input type="text" class="search" id="searchBox" placeholder="Buscar exame..." value="${escapeHtml(filter||'')}">
    <p class="list-label">Resultados mais recentes</p>
    ${itemsHtml}
    ${filtered.length? `<button class="icon-btn" style="width:100%;margin-top:12px;" onclick="shareUltimos()">Compartilhar</button>` : ''}
  `);
  window._ultimosRows = filtered;
  const box = document.getElementById('searchBox');
  box.oninput = ()=> showHome(box.value);
  if(filter!==undefined){ box.focus(); box.selectionStart = box.selectionEnd = box.value.length; }
}

async function showHistorico(filter){
  const exams = await getAll('exams');
  exams.sort((a,b)=>a.name.localeCompare(b.name));
  const f = (filter||'').toLowerCase();
  const filtered = f ? exams.filter(e=>e.name.toLowerCase().includes(f)) : exams;

  const itemsHtml = filtered.length ? `<div class="flat-list">` + filtered.map(e=>`
    <div class="flat-item" onclick="showExam(${e.id})">
      <div class="name">${escapeHtml(e.name)}</div>
      <div class="right"><div class="date">Ref: ${escapeHtml(e.reference||'-')}</div></div>
    </div>`).join('') + `</div>` : `<div class="empty">${exams.length? 'Nenhum exame encontrado.' : 'Nenhum exame cadastrado ainda.'}</div>`;

  render(`
    <button class="back" onclick="showHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Voltar</button>
    <h1 class="app-title">Histórico</h1>
    <input type="text" class="search" id="searchBox2" placeholder="Buscar exame..." value="${escapeHtml(filter||'')}">
    ${itemsHtml}
  `);
  const box = document.getElementById('searchBox2');
  box.oninput = ()=> showHistorico(box.value);
  if(filter!==undefined){ box.focus(); box.selectionStart = box.selectionEnd = box.value.length; }
}

function showCadastro(){
  render(`
    <button class="back" onclick="showHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Voltar</button>
    <h1 class="app-title">Cadastrar novo</h1>
    <label>Nome do exame</label>
    <input type="text" id="cName" placeholder="Ex: Colesterol Total">
    <div class="row">
      <div>
        <label>Mínimo (opcional)</label>
        <input type="text" id="cMin" placeholder="Ex: 150 mg/dL">
      </div>
      <div>
        <label>Máximo (opcional)</label>
        <input type="text" id="cMax" placeholder="Ex: 200 mg/dL">
      </div>
    </div>
    <div id="cErr" class="err hide">Preencha o nome do exame</div>
    <button class="btn" style="margin-top:16px;" onclick="saveExam()">Salvar</button>
  `);
}
async function saveExam(){
  const name = document.getElementById('cName').value.trim();
  const min = document.getElementById('cMin').value.trim();
  const max = document.getElementById('cMax').value.trim();
  const err = document.getElementById('cErr');
  if(!name){ err.classList.remove('hide'); return; }
  err.classList.add('hide');
  const id = await put('exams', {name, min, max});
  showExam(id);
}

async function showExam(examId, editMode, editResultId){
  const ex = await getOne('exams', examId);
  if(!ex){ showHistorico(); return; }
  let results = await getAll('results');
  results = results.filter(r=>r.examId===examId).sort((a,b)=>b.date.localeCompare(a.date));
  const editingResult = editResultId ? results.find(r=>r.id===editResultId) : null;

  let editBlock;
  if(editMode){
    editBlock = `
    <label>Nome do exame</label>
    <input type="text" id="eName" value="${escapeHtml(ex.name)}">
    <div class="row">
      <div>
        <label>Mínimo (opcional)</label>
        <input type="text" id="eMin" value="${escapeHtml(ex.min||'')}">
      </div>
      <div>
        <label>Máximo (opcional)</label>
        <input type="text" id="eMax" value="${escapeHtml(ex.max||'')}">
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn secondary" onclick="showExam(${examId})">Cancelar</button>
      <button class="btn" onclick="saveExamEdit(${examId})">Salvar</button>
    </div>
    `;
  } else if(editingResult){
    editBlock = `
    <div class="section-title">Editar resultado</div>
    <label>Data de recebimento</label>
    <input type="date" id="rDate" value="${escapeHtml(editingResult.date)}">
    <label>Resultado</label>
    <input type="text" id="rValue" value="${escapeHtml(editingResult.value)}">
    <div id="rErr" class="err hide">Preencha data e resultado</div>
    <div class="row" style="margin-top:14px;">
      <button class="btn secondary" onclick="showExam(${examId})">Cancelar</button>
      <button class="btn" onclick="saveResult(${examId},${editResultId})">Salvar</button>
    </div>
    `;
  } else {
    editBlock = `
    <div class="section-title">Lançar novo resultado</div>
    <label>Data de recebimento</label>
    <input type="date" id="rDate">
    <label>Resultado</label>
    <input type="text" id="rValue" placeholder="Ex: 185 mg/dL">
    <div id="rErr" class="err hide">Preencha data e resultado</div>
    <button class="btn" style="margin-top:14px;" onclick="saveResult(${examId})">Lançar</button>
    <button class="icon-btn" style="margin-top:4px;" onclick="showExam(${examId},true)">Editar nome / referência</button>
    `;
  }

  const resultsHtml = results.length ? `<div class="flat-list">` + results.map(r=>{
    const comp = compareResult(r.value, ex) || 'normal';
    const tagLabel = comp==='alto'?'Alto':comp==='baixo'?'Baixo':'Normal';
    return `
    <div class="result-row">
      <div><div class="value">${escapeHtml(r.value)} <span class="tag tag-${comp}">${tagLabel}</span></div><div class="date">${fmtDate(r.date)} &middot; Ref: ${escapeHtml(refLabel(ex))}</div></div>
      <button class="edit-link" onclick="showExam(${examId},false,${r.id})">editar</button>
    </div>`;
  }).join('') + `</div>` : `<div class="empty">Nenhum resultado lançado para este exame.</div>`;

  render(`
    <button class="back" onclick="showHistorico()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Voltar ao histórico</button>
    <h1 class="app-title">${escapeHtml(ex.name)}</h1>
    <p class="muted" style="margin-bottom:16px;">Referência: ${escapeHtml(refLabel(ex))}</p>
    ${editBlock}
    <p class="list-label" style="margin-top:22px;">Resultados</p>
    ${resultsHtml}
    ${results.length? `<button class="icon-btn" style="width:100%;margin-top:12px;" onclick="shareExam(${examId})">Compartilhar</button>` : ''}
  `);
}
async function saveExamEdit(examId){
  const name = document.getElementById('eName').value.trim();
  const min = document.getElementById('eMin').value.trim();
  const max = document.getElementById('eMax').value.trim();
  if(!name) return;
  await put('exams', {id:examId, name, min, max});
  showExam(examId);
}
async function saveResult(examId, resultId){
  const date = document.getElementById('rDate').value;
  const value = document.getElementById('rValue').value.trim();
  const err = document.getElementById('rErr');
  if(!date || !value){ err.classList.remove('hide'); return; }
  err.classList.add('hide');
  const record = resultId ? {id:resultId, examId, date, value} : {examId, date, value};
  await put('results', record);
  showExam(examId);
}

function makeA4Canvas(title, lines){
  const W=794, H=1123;
  const rowH=34, headerH=196, tableTop=156;
  const cols = [ {x:50,  w:190, label:'Exame'}, {x:240, w:85,  label:'Data'},
                 {x:325, w:185, label:'Referência'}, {x:510, w:95,  label:'Resultado'},
                 {x:605, w:140, label:'Status'} ];
  const maxRowsPerPage = Math.floor((H-headerH-60)/rowH);
  const pages = [];
  for(let i=0;i<lines.length;i+=maxRowsPerPage) pages.push(lines.slice(i,i+maxRowsPerPage));
  if(pages.length===0) pages.push([]);
  const statusColor = s => s==='Alto' ? '#B23A2E' : s==='Baixo' ? '#A05A00' : '#2E7D5B';
  return pages.map((pageLines, idx)=>{
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    const ctx = c.getContext('2d');
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3CA370'; ctx.fillRect(0,0,W,10);
    ctx.strokeStyle='#D9E6DD'; ctx.lineWidth=1.5; ctx.strokeRect(14,14,W-28,H-28);
    ctx.fillStyle='#1F2D27'; ctx.font='500 24px Arial'; ctx.fillText('Meus Exames', 50, 56);
    if(APP_ICON_BASE64 && appIconImg.complete && appIconImg.naturalWidth){
      ctx.drawImage(appIconImg, W-50-50, 30, 50, 50);
    } else {
      ctx.font='34px Arial'; ctx.fillText('🩺', W-50-44, 60);
    }
    ctx.font='400 14px Arial'; ctx.fillStyle='#6B7D74';
    const now=new Date(); const p=n=>String(n).padStart(2,'0');
    const genDate = p(now.getDate())+'/'+p(now.getMonth()+1)+'/'+now.getFullYear();
    ctx.fillText(profile.name+(profile.userId? ' - ID: '+profile.userId:'')+' - Gerado em '+genDate, 50, 82);
    ctx.font='500 19px Arial'; ctx.fillStyle='#1F2D27';
    ctx.fillText(title + (pages.length>1? ' — página '+(idx+1)+'/'+pages.length : ''), 50, 118);
    ctx.strokeStyle='#D9E6DD'; ctx.beginPath(); ctx.moveTo(50,134); ctx.lineTo(W-50,134); ctx.stroke();
    ctx.font='600 13px Arial'; ctx.fillStyle='#6B7D74';
    cols.forEach(col=>ctx.fillText(col.label, col.x, tableTop));
    ctx.strokeStyle='#D9E6DD'; ctx.beginPath(); ctx.moveTo(50,tableTop+12); ctx.lineTo(W-50,tableTop+12); ctx.stroke();
    let y = tableTop+36;
    pageLines.forEach(line=>{
      ctx.font='400 14px Arial'; ctx.fillStyle='#1F2D27';
      ctx.fillText(line.exame, cols[0].x, y, cols[0].w);
      ctx.fillText(line.data, cols[1].x, y, cols[1].w);
      ctx.fillText(line.referencia, cols[2].x, y, cols[2].w);
      ctx.fillText(line.resultado, cols[3].x, y, cols[3].w);
      ctx.fillStyle=statusColor(line.status); ctx.font='600 14px Arial';
      ctx.fillText(line.status, cols[4].x, y);
      ctx.strokeStyle='#EFF4F1'; ctx.beginPath(); ctx.moveTo(50,y+12); ctx.lineTo(W-50,y+12); ctx.stroke();
      y += rowH;
    });
    return c;
  });
}
async function downloadCanvas(canvas, filename){
  const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(downloadsCap){
    const buf = await blob.arrayBuffer();
    await downloadsCap.save({filename, data: new Uint8Array(buf)});
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  }
}
async function shareCanvases(canvases, baseFilename, title){
  const files = [];
  for(let i=0;i<canvases.length;i++){
    const blob = await new Promise(res=>canvases[i].toBlob(res,'image/png'));
    const filename = baseFilename+(canvases.length>1? '_p'+(i+1):'')+'.png';
    files.push(new File([blob], filename, {type:'image/png'}));
  }
  if(navigator.share && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  try{
    for(let i=0;i<canvases.length;i++) await downloadCanvas(canvases[i], files[i].name);
  }catch(e){ /* última tentativa: ignora silenciosamente se também falhar */ }
}
async function shareExam(examId){
  const ex = await getOne('exams', examId);
  let results = await getAll('results');
  results = results.filter(r=>r.examId===examId).sort((a,b)=>b.date.localeCompare(a.date));
  const lines = results.map(r=>{
    const comp = compareResult(r.value, ex) || 'normal';
    return {exame:ex.name, data:fmtDate(r.date), referencia:refLabel(ex), resultado:r.value,
      status: comp==='alto'?'Alto':comp==='baixo'?'Baixo':'Normal'};
  });
  const canvases = makeA4Canvas(ex.name, lines);
  await shareCanvases(canvases, 'MeusExames_'+ex.name.replace(/\s+/g,'_'), ex.name);
}
async function shareUltimos(){
  const rows = window._ultimosRows || [];
  const lines = rows.map(r=>{
    const comp = compareResult(r.last.value, r.ex) || 'normal';
    return {exame:r.ex.name, data:fmtDate(r.last.date), referencia:refLabel(r.ex), resultado:r.last.value,
      status: comp==='alto'?'Alto':comp==='baixo'?'Baixo':'Normal'};
  });
  const canvases = makeA4Canvas('Últimos resultados', lines);
  await shareCanvases(canvases, 'MeusExames_Ultimos', 'Últimos resultados');
}

  const av = profile.avatar ? `<img src="${profile.avatar}">` : initials(profile.name);
  render(`
    ${firstTime? '' : `<button class="back" onclick="showHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Voltar</button>`}
    <h1 class="app-title">Perfil</h1>
    ${firstTime? `<p class="muted" style="margin-bottom:16px;">Cadastre seu nome para começar.</p>` : ''}
    <div style="text-align:center;margin-bottom:18px;">
      <div class="avatar" style="width:72px;height:72px;font-size:26px;margin:0 auto 10px;">${av}</div>
      <label class="photo-tag" for="avatarInput">Escolher foto</label>
      <input type="file" accept="image/*" id="avatarInput" style="display:none;">
    </div>
    <label>Nome</label>
    <input type="text" id="sName" value="${escapeHtml(profile.name)}" placeholder="Digite seu nome">
    <div id="sErr" class="err hide">Digite seu nome para continuar</div>
    ${profile.userId? `<p class="muted" style="margin-top:10px;">${escapeHtml(profile.name)}<br>ID: ${escapeHtml(profile.userId)} (não muda ao editar o nome)</p>` : ''}
    <div class="row" style="margin-top:16px;">
      ${firstTime? '' : `<button class="btn secondary" onclick="showHome()">Cancelar</button>`}
      <button class="btn" onclick="saveProfile()">Salvar</button>
    </div>
  `);
  document.getElementById('avatarInput').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ profile.avatar = reader.result; showPerfil(firstTime); };
    reader.readAsDataURL(file);
  };
}
async function saveProfile(){
  const name = document.getElementById('sName').value.trim();
  const err = document.getElementById('sErr');
  if(!name){ err.classList.remove('hide'); return; }
  profile.name = name;
  if(!profile.userId) profile.userId = genId();
  await put('profile', profile);
  showHome();
}

function showBackup(){
  render(`
    <button class="back" onclick="showHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Voltar</button>
    <h1 class="app-title">Backup</h1>
    <div class="muted">
      <p>Ao exportar, o arquivo é salvo na pasta <strong style="font-weight:500;color:var(--text)">Download</strong> do celular.</p>
      <p>Para importar, o app só encontra o arquivo se ele estiver na pasta Download ou no <strong style="font-weight:500;color:var(--text)">Google Drive</strong>.</p>
      <p>Recebeu o arquivo pelo WhatsApp de outro celular? Mova-o para o Google Drive antes de importar.</p>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn" onclick="exportBackup()">Exportar</button>
      <label class="btn secondary" for="importInput" style="margin-bottom:0;">Importar</label>
    </div>
    <input type="file" accept=".json,application/json" id="importInput" style="display:none;">
    <div id="importMsg" class="muted" style="margin-top:8px;"></div>
  `);
  document.getElementById('importInput').onchange = importBackup;
}
async function exportBackup(){
  const exams = await getAll('exams');
  const results = await getAll('results');
  const data = JSON.stringify({profile, exams, results}, null, 2);
  const bytes = new TextEncoder().encode(data);
  if(downloadsCap){
    await downloadsCap.save({filename:'MeusExames_backup.json', data: bytes});
  } else {
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='MeusExames_backup.json'; a.click();
  }
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const msg = document.getElementById('importMsg');
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      await clearStore('exams'); await clearStore('results');
      if(data.profile){ profile = {...data.profile, id:'main'}; await put('profile', profile); }
      for(const ex of (data.exams||[])) await put('exams', ex);
      for(const r of (data.results||[])) await put('results', r);
      msg.textContent = 'Backup importado com sucesso.'; msg.style.color = 'var(--btn-dark)';
    }catch(err){
      msg.textContent = 'Arquivo inválido. Verifique se é um backup do Meus Exames.'; msg.style.color = 'var(--danger)';
    }
  };
  reader.readAsText(file);
}
